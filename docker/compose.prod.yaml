services:
  identity-service:
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_PRETTY: 'false'
    # Anything driving the stack over the Docker socket can gate on this (the retired ds1 deploy did) —
    # no host port needed. Hits the service's own /health on the in-container port via node (no
    # busybox/curl assumption). start_period covers boot; the image build is already green, this just
    # waits to listen.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7305/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  console:
    environment:
      NODE_ENV: production
    # /login is public and always 200s once the server is listening — use it as the liveness probe
    # (the console has no dedicated /health endpoint). Next standalone boot is fast.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:7306/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
