# Focused STRUCTURAL seed for the Skills Coach (ADR-0011, ADR-0019, ADR-0020).
#
# Per ADR-0011, applications + credentials are declarative/GitOps (this file); users are operational and
# owned by the live DB (ADR-0008), managed via the admin plane. So this file lists NO users and
# references NO ${SEED_*} secrets — it is dispatchable on its own.
#
# Replaces the former `coach` application, which had drifted from the product on every field that
# matters. What the deployment actually expects, from skills-coach `config/ds1/.env.base`:
#   - `AUTH_AUDIENCE=skills-coach`          — was `coach-workspace`, so no token it issued would verify
#   - `WEB_IDENTITY_CLIENT_ID=skills-coach-web` — was `coach-web`, so the login call named a client that
#                                             did not exist
# The role catalogue drifted too: the product's vocabulary is `learner` + `coach`
# (api/src/auth/capabilities.ts ROLE_CAPABILITIES), never the `compliance-officer` the old catalogue
# carried — a token with that role would resolve to no capabilities at all.
#
# Apply via the seed-ds1 workflow:  gh workflow run seed-ds1.yml -f seed_file=config/seed.skills-coach.yaml
# Or on the ds1 host from service/:  SEED_FILE=../config/seed.skills-coach.yaml \
#   MONGO_URI=mongodb://localhost:27019 MONGO_DB_NAME=identity-service npm run seed

applications:
  - id: skills-coach
    name: Skills Coach
    audience: skills-coach               # the coach API verifies this as AUTH_AUDIENCE
    roles:                               # the role catalogue (ADR-0019) → token `roles` (RQ-0005)
      - { key: learner, name: Learner, description: Practise drills and read their own progress }
      - { key: coach, name: Coach, description: Publish packs, read all submissions, write corrections }
    resources:                           # the protected resources this product owns (ADR-0009 Phase 2)
      # Skills Coach's own MCP endpoint. A credential below may pass this as the RFC 8707 `resource`, and
      # the issued token's `aud` binds to it instead of `skills-coach`. Without this line the authorize
      # request is refused `invalid_target` before a browser ever opens — which reads as "nothing
      # happened", not as an auth error.
      - https://coach-mcp.fps4.nl/mcp
    credentials:
      - id: skills-coach-web
        name: Skills Coach Web
        # The web surface signs in with the password grant (WEB_AUTH_MODE=component-auth); it has no
        # /auth/callback route, so there is no redirect leg to register. Add `authorization_code` and the
        # callback URI here together, if and when it grows one.
        grantTypes: [password]
        redirectUris: []
        isConfidential: false            # public client — the browser sends client_id with no secret

      # --- The coach surface (ADR-0001 over there: content and corrections enter through /coach/v1).
      # A machine principal, because the caller is a script or an agent runner, not a person: the
      # importer publishing a pack manifest, and the publish-pack workflow that wraps it.
      #
      # `claims.roles` is how a client-credentials token carries authority at all (US-0086). Skills
      # Coach maps roles to capabilities in its own code and reads nothing else — a token without
      # `roles` falls back to its documented baseline, `learner`, and every coach call is refused.
      - id: skills-coach-coach
        name: Skills Coach — coach automation
        grantTypes: [client_credentials]
        isConfidential: true
        secret: ${SKILLS_COACH_COACH_CLIENT_SECRET}
        subject: coach@skills-coach.fps4.nl
        claims:
          roles: [coach]

      # --- The interactive coach credential, for an MCP client on an operator's laptop.
      #
      # Public and PKCE-authenticated: a CLI cannot keep a secret (RFC 8252). `redirectUris` is
      # exact-matched, so this loopback URI must equal the client's `--callback-port` exactly —
      # there is no wildcard-port allowance.
      #
      # Authority is the OPERATOR's, never this credential's: the person signing in needs an active
      # `coach` assignment on this application, which is operational state and so is not seeded
      # here (ADR-0011). Without it the login succeeds and every tool still refuses.
      #
      # The token's `aud` is bound to the MCP resource by the client passing
      # `resource=https://coach-mcp.fps4.nl/mcp` (RFC 8707); Skills Coach accepts that URL as an
      # audience alongside `skills-coach` itself.
      - id: skills-coach-mcp-operator
        name: MCP client — interactive coach login
        grantTypes: [authorization_code]
        redirectUris:
          - http://localhost:9415/callback
        isConfidential: false
