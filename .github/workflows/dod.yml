name: Definition of Done

# The quality gate maestro reads before opening the merge gate. Build + test must be green.
#
# Runners: every job below runs on GitHub-hosted ubuntu-latest (fps4/maestro ADR-0017: a self-hosted
# runner on a public repository runs strangers' code — a fork's pull request executes on it). The jobs
# were on the org's ds1 runner (#21) and never depended on anything of it; the same steps run here
# unchanged. Nothing deploys from this gate: deployment is a Terraform module applied by a tenant's own
# pipeline (maestro ADR-0016/0017), and the ds1 deploy and seed workflows that used to chain off it are
# gone.
#
# CodeQL runs alongside, also GitHub-hosted, via code scanning *default setup*: it is configured in repo
# settings and generates its workflow server-side, so there is no file here to grep. Inspect it with:
#   gh api repos/fps4/identity-service/code-scanning/default-setup

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # Supersede in-flight runs per ref so a PR's pushes don't queue behind each other. main is exempt:
  # maestro reads DoD on main to open the merge gate, so every push there gets its own verdict.
  group: dod-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  service:
    name: service (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    # The tests run against DynamoDB Local (ADR-0023): the same image the compose loop runs, in memory,
    # each test file on a table of its own (service/tests/helpers/store.ts).
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      AWS_REGION: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The service depends on @fps4/maestro-spine, which needs Node >= 22.14; the Lambda
          # runtime is nodejs22.x. The other packages stay on 20 until they move.
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

  sdk:
    name: sdk (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

  react:
    name: react (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test -- --run

  console:
    name: console (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    # Build + vitest unit/component tests (RQ-0008). The Playwright smoke (npm run test:e2e) is local —
    # it is not wired into the gate yet (it needs a browser install step); nothing about the runner
    # stops it any more.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm test

  dependency-scan: # fps4 security floor (standards/security.yaml) — the advisory-DB vuln scan, BLOCKING.
    # DISTINCT from secret-scan: this asks "is a package we depend on known-bad?". Trivy filesystem scan
    # on HIGH,CRITICAL with --ignore-unfixed (only actionable advisories gate, so transitive unfixed noise
    # never red-walls a PR). Never disabled. A product that ships an image SHOULD also add a `scan-type:
    # image` scan of the built tag (cf. ../maestro dod.yml) to catch pinned transitives this fs scan can't.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cache the trivy vuln DB # warm-start so a registry blip/rate-limit doesn't flake the gate
        uses: actions/cache@v4
        with:
          path: .cache/trivy
          key: trivy-db
      - name: trivy filesystem scan (deps, IaC misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"          # BLOCKING — a fixable HIGH/CRITICAL fails the gate
          format: table
        env:
          TRIVY_CACHE_DIR: .cache/trivy
